notifications: true
virtual_modifiers:
  - BTN_SIDE   # Called 'XButton1' in nodoka, 'button4' in Karabiner-Elements
  - BTN_EXTRA  # Called 'XButton2' in nodoka, 'button5' in Karabiner-Elements

modmap:
  - name: Global
    remap:
      CapsLock: Ctrl_R
      BTN_SIDE:
        alone: [ALT_L, Left]
        held: BTN_SIDE

keymap:
  - name: Global
    remap:
      BTN_SIDE-BTN_RIGHT: C-w
      BTN_SIDE-XUPSCROLL: C-S-Tab
      BTN_SIDE-XDOWNSCROLL: C-Tab
      BTN_SIDE-XLEFTSCROLL: A-Left
      BTN_SIDE-XRIGHTSCROLL: A-Right

      BTN_EXTRA-BTN_RIGHT: W-q

  - name: Emacs
    application:
      not:
        - "Alacritty"
        - "URxvt"
        - "foot"
        - "com.mitchellh.ghostty"
        - "jetbrains-idea"
        - "jetbrains-studio"
    remap:
      C_R-b: { with_mark: left }
      C_R-f: { with_mark: right }
      C_R-p: { with_mark: up }
      C_R-n: { with_mark: down }
      C_R-a: { with_mark: home }
      C_R-e: { with_mark: end }
      C_R-m: enter
      C_R-j: enter
      C_R-o: [enter, left]
      C_R-h: [backspace, { set_mark: false }]
      C_R-d: [delete, { set_mark: false }]
      C_R-k: [Shift-end, C-x, { set_mark: false }]
      C_R-space: { set_mark: true }
      C_R-g: [esc, { set_mark: false }]
